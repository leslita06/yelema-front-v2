<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Page introuvable, Yelema</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../app.css"><script>try{var a=localStorage.getItem("yap")||"clair";if(a==="sombre"||(a==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-mode","nuit")}catch(e){}</script><style>
[hidden]{display:none!important}
body.v36-eb{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:var(--bg)}
.v36-e{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:36px 32px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;position:relative;overflow:hidden}
.v36-e .v36-elogo{background:#fff;border-radius:14px;padding:10px 14px;border:1px solid var(--line)}
.v36-e .v36-elogo img{height:30px;display:block}

.v36-e .v36-ecode{font-family:var(--f-num);font-size:64px;line-height:1;font-weight:700;color:var(--brand-ink);margin-top:18px;letter-spacing:-.02em}
.v36-e h1{font-size:28px;line-height:1.15;font-weight:700}
.v36-e p{color:var(--ink-2);font-size:15.5px}
.v36-ebs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.v36-ebs .btn{cursor:pointer;border:0;font:inherit;font-weight:600}.v36-ebs .btn.o{border:1px solid var(--line)}
.v36-sup{width:100%;background:var(--bg);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.v36-sup code{font-family:ui-monospace,Menlo,monospace;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.v36-spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:v36r .7s linear infinite;display:inline-block}

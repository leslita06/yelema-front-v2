{{head:Personnaliser}}
<body>
<div class="page">
  <header class="appbar">
    <a class="ib" href="djeneba.html" aria-label="Retour">{{i:arrow-left}}</a>
    <div class="grow"><b style="font-size:16px;font-weight:650">Votre Chief of Staff</b><div class="xs mute3">Son prénom et son visage sont à vous</div></div>
  </header>

  <div class="worker" style="max-width:240px;margin:8px auto 0;display:block">
    <img src="img/djeneba.jpg" alt="">
    <div class="ft"><h3>Djénéba</h3><div class="role">Chief of Staff</div></div>
  </div>

  <div class="row" style="justify-content:center;gap:10px;margin-top:16px">
    <img src="img/djeneba.jpg" alt="Visage actuel" width="52" height="52" style="border-radius:50%;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--violet)">
    <img src="img/awa.jpg" alt="" width="52" height="52" style="border-radius:50%">
    <img src="img/nadia.jpg" alt="" width="52" height="52" style="border-radius:50%">
    <img src="img/salif.jpg" alt="" width="52" height="52" style="border-radius:50%">
    <span class="ib box" style="width:52px;height:52px;border-radius:50%" aria-label="Importer une photo">{{i:upload}}</span>
  </div>

  <label class="sm" style="display:block;font-weight:600;margin-top:24px" for="prenom">Son prénom</label>
  <div id="prenom" class="pairbar" style="margin-top:6px;min-height:52px;border:2px solid var(--violet)">Djénéba</div>
  <p class="xs mute3" style="margin-top:6px">Par exemple : Mariétou, Kady, Ama</p>

  <span class="sm" style="display:block;font-weight:600;margin-top:20px">Sa façon de vous parler</span>
  <nav class="seg" style="margin-top:6px"><a class="on">Vouvoie</a><a>Tutoie</a></nav>

  <a class="btn p full" href="djeneba.html" style="margin-top:28px">Enregistrer</a>
</div>
</body></html>
